
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaff">
  <meta name="description" content="Sugar & Grace — A Little Sugar. A lot of Grace.">
  <title>Sugar &amp; Grace | A Little Sugar. A lot of Grace.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #f20a91;
      --pink-dark: #cf0879;
      --purple: #7410ef;
      --purple-dark: #5700ca;
      --teal: #08c1c8;
      --teal-dark: #009ca9;
      --ink: #6420a5;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 5% 15%, #ffe0f3 0, transparent 34%),
        radial-gradient(ellipse at 95% 40%, #dcfbfb 0, transparent 32%),
        #fffaff;
      color: var(--ink);
      font-family: "Poppins", Arial, sans-serif;
    }

    .page {
      position: relative;
      width: min(100% - 34px, 560px);
      margin: 0 auto;
      padding: 35px 0 25px;
      text-align: center;
    }

    .hero {
      position: relative;
      isolation: isolate;
    }

    .logo-frame {
      position: relative;
      width: 91%;
      margin: 0 auto;
      padding: 7px;
      background: white;
      border: 3px solid var(--pink);
      border-radius: 50%;
      box-shadow:
        0 5px 0 var(--teal),
        0 10px 0 var(--pink),
        0 15px 24px #8123b522;
    }

    .logo-frame::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 2px solid var(--teal);
      border-radius: 50%;
      pointer-events: none;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 50%;
    }

    .decoration {
      position: absolute;
      z-index: -1;
      font-family: Georgia, serif;
      font-weight: bold;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .heart-one {
      top: 4%;
      left: 0;
      color: var(--pink);
      font-size: clamp(35px, 10vw, 55px);
      transform: rotate(-15deg);
    }

    .heart-two {
      top: 8%;
      right: 0;
      color: var(--pink);
      font-size: clamp(32px, 9vw, 50px);
      transform: rotate(13deg);
    }

    .star-one {
      top: 35%;
      left: -3%;
      color: var(--purple);
      font-size: 30px;
    }

    .star-two {
      top: 28%;
      right: -3%;
      color: var(--teal);
      font-size: 37px;
    }

    .heart-three {
      bottom: 0;
      left: -2%;
      color: var(--teal);
      font-size: 24px;
      transform: rotate(-15deg);
    }

    .heart-four {
      bottom: 1%;
      right: -2%;
      color: var(--purple);
      font-size: 25px;
      transform: rotate(15deg);
    }

    .brand-slogan {
      margin: 39px 0 4px;
      color: var(--pink);
      font-family: "Pacifico", cursive;
      font-size: clamp(25px, 7vw, 39px);
      line-height: 1.55;
      text-shadow: 1px 2px 0 #ffffff;
    }

    .brand-slogan .sugar {
      color: var(--teal-dark);
    }

    .brand-slogan .grace {
      color: var(--purple);
    }

    .slogan-flourish {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 9px 0 13px;
      color: var(--pink);
      font-size: 30px;
    }

    .slogan-flourish::before,
    .slogan-flourish::after {
      content: "";
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, var(--teal), var(--pink));
      border-radius: 50%;
      transform: rotate(-8deg);
    }

    .faith {
      margin: 0 0 25px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .faith span {
      color: var(--pink);
    }

    .socials {
      display: grid;
      gap: 17px;
      margin: 0 auto;
      padding: 0 7px;
    }

    .social {
      position: relative;
      display: flex;
      min-height: 85px;
      align-items: center;
      overflow: hidden;
      padding: 11px 18px;
      border: 3px solid #ffffff;
      border-radius: 50px;
      color: #ffffff;
      text-align: left;
      text-decoration: none;
      box-shadow:
        0 5px 0 #6e287326,
        0 9px 17px #4d17711b,
        inset 0 2px 1px #ffffff75,
        inset 0 -3px 4px #00000016;
      transition: transform 180ms ease, filter 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .social::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        155deg,
        #ffffff30 0%,
        transparent 37%,
        transparent 70%,
        #ffffff12 100%
      );
      pointer-events: none;
    }

    .social::after {
      content: "♥  ♥";
      position: absolute;
      right: 48px;
      bottom: 5px;
      color: #ffffff17;
      font-size: 21px;
      letter-spacing: 12px;
      pointer-events: none;
    }

    .social:hover {
      transform: translateY(-3px);
      filter: brightness(1.06);
    }

    .social:active {
      transform: scale(.98);
    }

    .social:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    .instagram {
      background: linear-gradient(110deg, #ff159c, #e20aa4 55%, #b51cd0);
    }

    .facebook {
      background: linear-gradient(110deg, #8d14f4, #7010e9 55%, #5136ef);
    }

    .tiktok {
      background: linear-gradient(110deg, #0bc8ce, #05b6c0 55%, #0795aa);
    }

    .social-icon {
      position: relative;
      z-index: 1;
      display: grid;
      flex: 0 0 56px;
      width: 56px;
      height: 56px;
      place-items: center;
      border: 2px solid #ffffff80;
      border-radius: 18px;
      background: #ffffff16;
    }

    .social-icon svg {
      width: 31px;
      height: 31px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-icon .fill {
      fill: currentColor;
      stroke: none;
    }

    .social-copy {
      position: relative;
      z-index: 1;
      min-width: 0;
      flex: 1;
      padding-left: 15px;
    }

    .social-name {
      display: block;
      font-family: "Pacifico", cursive;
      font-size: clamp(18px, 5vw, 25px);
      line-height: 1.4;
      text-shadow: 0 2px 2px #00000013;
    }

    .social-description {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .2px;
    }

    .arrow {
      position: relative;
      z-index: 1;
      padding-left: 7px;
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
    }

    .bottom-flourish {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 30px 0 12px;
      color: var(--pink);
      font-size: 37px;
    }

    .bottom-flourish::before,
    .bottom-flourish::after {
      content: "〰";
      color: var(--teal);
      font-size: 39px;
    }

    footer {
      padding: 13px 0 0;
      color: #7b5a91;
      font-size: 11px;
      line-height: 1.8;
    }

    footer strong {
      color: var(--purple);
    }

    @media (min-width: 600px) {
      .page {
        padding-top: 50px;
      }

      .social {
        min-height: 96px;
        padding: 13px 25px;
      }

      .social-icon {
        flex-basis: 63px;
        width: 63px;
        height: 63px;
      }

      .social-copy {
        padding-left: 19px;
      }

      .social-description {
        font-size: 13px;
      }
    }

    @media (max-width: 360px) {
      .page {
        width: calc(100% - 26px);
      }

      .social {
        min-height: 76px;
        padding: 9px 12px;
      }

      .social-icon {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
        border-radius: 14px;
      }

      .social-icon svg {
        width: 26px;
        height: 26px;
      }

      .social-copy {
        padding-left: 10px;
      }

      .social-description {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero" aria-label="Sugar and Grace">
      <span class="decoration heart-one" aria-hidden="true">♡</span>
      <span class="decoration heart-two" aria-hidden="true">♡</span>
      <span class="decoration star-one" aria-hidden="true">✦</span>
      <span class="decoration star-two" aria-hidden="true">✧</span>
      <span class="decoration heart-three" aria-hidden="true">♥</span>
      <span class="decoration heart-four" aria-hidden="true">♥</span>

      <div class="logo-frame">
        <img
          class="logo"
          src="16522.JPG"
          alt="Sugar & Grace — A Little Sugar. A lot of Grace."
        >
      </div>
    </section>

    <h1 class="brand-slogan">
      A Little <span class="sugar">Sugar.</span>
      A lot of <span class="grace">Grace.</span>
    </h1>

    <div class="slogan-flourish" aria-hidden="true">♡</div>

    <p class="faith">
      ♥ <span>FAITH</span> · LOVE · A LITTLE SWEETNESS ♥
    </p>

    <nav class="socials" aria-label="Sugar and Grace social media">

      <a
        class="social instagram"
        href="https://www.instagram.com/sugarandgrace93?dlrf=dTQxcm5sNmY5MWlw"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Sugar and Grace on Instagram"
      >
        <span class="social-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="fill" cx="17.5" cy="6.5" r="1.2"></circle>
          </svg>
        </span>
        <span class="social-copy">
          <span class="social-name">Instagram</span>
          <span class="social-description">Follow along with us</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a
        class="social facebook"
        href="https://www.facebook.com/share/1CGbxVhEE8/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Sugar and Grace on Facebook"
      >
        <span class="social-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path class="fill" d="M13.5 21v-8h2.8l.4-3.1h-3.2v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"></path>
          </svg>
        </span>
        <span class="social-copy">
          <span class="social-name">Facebook</span>
          <span class="social-description">Join our community</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a
        class="social tiktok"
        href="https://www.tiktok.com/@jencrys?_r=1&amp;_t=ZT-9Aft1mPMDgE"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Sugar and Grace on TikTok"
      >
        <span class="social-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M14 3v11.1a4.1 4.1 0 1 1-3-3.95"></path>
            <path d="M14 3c.4 3.2 2.2 5.1 5.5 5.4"></path>
          </svg>
        </span>
        <span class="social-copy">
          <span class="social-name">TikTok</span>
          <span class="social-description">Watch, follow &amp; connect</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

    </nav>

    <div class="bottom-flourish" aria-hidden="true">♡</div>

    <footer>
      Made with love for <strong>Jennifer &amp; Crystal</strong><br>
      A Little Sugar. A lot of Grace. ♥
    </footer>

  </main>
</body>
</html>
